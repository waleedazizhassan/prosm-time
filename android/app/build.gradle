apply plugin: 'com.android.application'

// Real release signing - reads android/keystore.properties (git-ignored,
// never committed - see .gitignore's own comment on why losing this
// keystore is permanent). Falls back to null (an unsigned release build)
// if the properties file isn't present, so CI/other machines without the
// keystore don't hard-fail - only this machine's own release builds are
// actually signed until the keystore is provisioned elsewhere too.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "net.prosm.time"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        // Required so MainActivity can read BuildConfig.DEBUG and switch
        // off WebView remote inspection in release builds.
        buildConfig = true
    }
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "net.prosm.time"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "2.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // § real gap found 2026-09-11: a real signed release build
            // with minifyEnabled/shrinkResources on crashed immediately
            // on a real device (React ErrorBoundary, "Something went
            // wrong") even AFTER the separate JS-obfuscation pass was
            // already ruled out and disabled - this native-layer R8
            // shrink/strip was the other piece of today's hardening
            // that had never actually been runtime-tested on a real
            // device before it first shipped signed. proguard-rules.pro
            // is meant to keep every Capacitor/WebView entry point, but
            // evidently doesn't cover something real. Disabled for now
            // (real signing is untouched and stays on - that part is
            // proven safe). Re-enable only after a real device confirms
            // it no longer crashes with R8 on.
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }
    packagingOptions {
        // No stray debug metadata in the shipped APK.
        exclude 'DebugProbesKt.bin'
        exclude '**/*.map'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
