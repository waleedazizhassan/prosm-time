name: PROSM Time Release

# PROSM Time - user-directed: "any real update should build and publish
# automatically." Triggers on every push to main (not just tags) -
# builds Web/Android/Windows, publishes a GitHub Release tagged with
# package.json's own version, with all three artifacts (APK, Windows
# installer, web build zip) attached to that same release, and
# publishes latest-version.json for UpdateAvailableBanner.tsx to poll.
# cancel-in-progress avoids a pileup of superseded builds when several
# commits land close together (this repo has seen many commits per
# hour in real sessions).
#
# Web is a downloadable zip, not a live hosted URL: GitHub Pages
# requires a paid plan on a PRIVATE repository (confirmed live -
# "Your current plan does not support GitHub Pages for this
# repository", HTTP 422). Rather than pay for Pages or add an external
# host, the repo itself went PUBLIC instead (user-directed, 2026-09-11)
# - a public repo's Release assets are downloadable by anyone with a
# plain browser, no GitHub account or login required, which was the
# user's actual real requirement all along. The web build is still
# distributed the same way as the APK/EXE (a zip attached to the
# Release) rather than a live hosted URL, since Pages itself still
# needs a paid plan regardless of visibility.
#
# Every artifact is uploaded under a FIXED filename (PROSM-Time.apk /
# PROSM-Time-Setup.exe / PROSM-Time-Web.zip), not one that embeds the
# version number, specifically so prosm.net's own download buttons can
# point at GitHub's own stable "always the newest release" URL pattern
# once and never need editing again on any future release:
#   https://github.com/<owner>/prosm-time/releases/latest/download/PROSM-Time.apk
#   https://github.com/<owner>/prosm-time/releases/latest/download/PROSM-Time-Setup.exe
#   https://github.com/<owner>/prosm-time/releases/latest/download/PROSM-Time-Web.zip
#
# GitHub is the build/distribution source only - installed clients
# never update themselves from source, they read the published
# manifest and point the user at the official download for their
# platform (see UpdateAvailableBanner.tsx).
#
# § real gap fix, 14-point live-audit gap #1: this workflow used to
# ship the unsigned, unhardened `assembleDebug` Android build with no
# test gate at all. It now runs the real test suite before any build
# job starts, and Android now builds the real signed `assembleRelease`
# instead (R8/ProGuard shrinking is currently OFF on this build type -
# see docs/SECURITY_HARDENING.md's Layer 3 for why - only real signing
# is active here for now).
# That real release build needs the local signing keystore this session
# generated (android/app/prosm-time-release.keystore, gitignored by
# design - never committed) available to CI as 4 repo secrets. One-time
# setup, from a machine that has the real keystore file and `gh` CLI
# authenticated against this repo:
#
#   cd prosm-time
#   base64 -w0 android/app/prosm-time-release.keystore > keystore.b64
#   gh secret set ANDROID_KEYSTORE_BASE64 --repo <owner>/<repo> < keystore.b64
#   gh secret set ANDROID_KEYSTORE_PASSWORD --repo <owner>/<repo>   # paste storePassword from android/keystore.properties
#   gh secret set ANDROID_KEY_ALIAS --repo <owner>/<repo>           # paste keyAlias from android/keystore.properties
#   gh secret set ANDROID_KEY_PASSWORD --repo <owner>/<repo>        # paste keyPassword from android/keystore.properties
#   rm keystore.b64
#
# Until these 4 secrets exist, the android job's own "Provision the
# release signing keystore from secrets" step fails loudly and on
# purpose - it will never silently fall back to an unsigned build.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: prosm-time-release
  cancel-in-progress: true

permissions:
  contents: write

# § real root cause found 2026-09-11: every CI-built artifact (web,
# Android, Windows - all three) has been crashing immediately on
# launch ("Missing Supabase environment variables", thrown from
# getSupabaseClient()) since the day this workflow was first created.
# Vite bakes import.meta.env.VITE_* values in at BUILD TIME from
# whatever's in the environment/.env - locally that's a real .env file
# (correctly gitignored, real credentials never committed), but CI has
# never had these values at all, so every CI build has shipped with
# them literally undefined. Three separate hardening-related
# hypotheses (JS obfuscation, Android R8/ProGuard, Electron asar) were
# investigated and ruled out chasing this same symptom before the real
# cause was found via a real console error captured from a diagnostic
# build - none of those were actually it.
#
# VITE_SUPABASE_ANON_KEY is Supabase's own "publishable" key (the
# sb_publishable_ prefix) - it is DESIGNED to be public and ship inside
# the client bundle; the real security boundary is RLS, not hiding this
# value. Safe to commit directly here rather than as a GitHub secret.
#
# VITE_UPDATE_MANIFEST_URL - UpdateAvailableBanner.tsx's own poll
# target. Its header comment explains why this was left unset until
# now: a private repo has no public, no-auth URL for public/latest-
# version.json (both raw-file and Release-asset URLs require GitHub
# auth on a private repo). The repo went public later in this same
# session specifically to make release download URLs work with zero
# GitHub-account requirement for end users - that also happens to be
# exactly the precondition this banner was waiting on. raw.
# githubusercontent.com serves a public repo's files with no auth,
# confirmed live (200 OK) before wiring this in.
env:
  VITE_SUPABASE_URL: https://wcfdhsxzeryqwpmftgay.supabase.co
  VITE_SUPABASE_ANON_KEY: sb_publishable_HIckVV9KFC3f6xhq6VS5RQ_KGybZ6bt
  VITE_UPDATE_MANIFEST_URL: https://raw.githubusercontent.com/waleedazizhassan/prosm-time/main/public/latest-version.json

jobs:
  # § real gap fix, 14-point live-audit gap #1: this workflow had no
  # test/type-check gate at all before building and publishing a real
  # release - a broken commit would have shipped straight to users.
  test:
    name: Type-check and test
    runs-on: ubuntu-latest
    outputs:
      # § real bug fix, 2026-09-11 - one canonical timestamp for this
      # entire workflow run, generated once here and threaded (as
      # VITE_BUILD_RELEASED_AT) into every builder job's own `npm run
      # build` below AND into deploy-web's public/latest-version.json
      # write - guaranteeing a running client's own baked-in value and
      # the manifest it polls always agree for the release that
      # produced it. See UpdateAvailableBanner.tsx's own header comment
      # for why this replaced a package.json version-number comparison
      # (the version field never actually changes release to release).
      releasedAt: ${{ steps.timestamp.outputs.releasedAt }}
      # § user-directed, 2026-09-11 - "I want version numbering to be
      # real and automatic." package.json's own version never changed
      # across many real releases before this - patch-bumped once here
      # (current version's patch segment + 1) and threaded into every
      # builder job below, same pattern as releasedAt above. A manual
      # major/minor bump in package.json still works exactly as before
      # (e.g. hand-edit to "3.0.0") - the NEXT release after that auto-
      # continues from "3.0.1", "3.0.2", ... this only ever increments,
      # never guesses at a major/minor jump on its own.
      nextVersion: ${{ steps.nextversion.outputs.nextVersion }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - id: timestamp
        run: echo "releasedAt=$(node -e 'console.log(new Date().toISOString())')" >> "$GITHUB_OUTPUT"
      - id: nextversion
        run: |
          NEXT=$(node -e '
            const pkg = require("./package.json");
            const parts = pkg.version.split(".").map(Number);
            parts[2] = (parts[2] || 0) + 1;
            console.log(parts.join("."));
          ')
          echo "nextVersion=$NEXT" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK (release, signed)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Install missing Android SDK packages into the runner's own pre-installed SDK
        # ubuntu-latest already ships a real Android SDK at $ANDROID_SDK_ROOT
        # with its own ANDROID_HOME set to that same path - installing a
        # SECOND, separate SDK under $HOME and pointing ANDROID_HOME at it
        # (the original version of this step) put the two env vars at
        # different paths, which Gradle refuses to proceed with ("Several
        # environment variables... contain different paths to the SDK").
        # Real fix, found from a real failed run: reuse the runner's own
        # SDK_ROOT, just install the specific packages this repo needs into
        # it, and never touch ANDROID_HOME.
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" | sort -r | head -1)
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Set this release's version in package.json
        env:
          NEXT_VERSION: ${{ needs.test.outputs.nextVersion }}
        run: node -e 'const fs=require("fs"); const p=require("./package.json"); p.version=process.env.NEXT_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - run: npm run build
        env:
          VITE_BUILD_RELEASED_AT: ${{ needs.test.outputs.releasedAt }}
      - run: npx cap sync android

      - name: Sync app version into the Android project
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      # § real gap fix, 14-point live-audit gap #1: CI was shipping the
      # unsigned, unhardened assembleDebug build - the real signing
      # keystore this session provisioned (android/app/prosm-time-
      # release.keystore) only exists on the machine that generated it,
      # gitignored by design (docs/SECURITY_HARDENING.md). It's read
      # from 4 repo secrets here instead of ever being committed. Until
      # those secrets exist, this step fails loudly rather than
      # silently falling back to an unsigned build (build.gradle's own
      # hasSigningConfig check would otherwise do exactly that) - see
      # this workflow's own trailing comment for the one-time setup
      # command the repo owner needs to run.
      - name: Provision the release signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 (and the 3 matching password/alias secrets) are not set on this repo yet - see release.yml's own trailing comment for the one-time 'gh secret set' commands. Refusing to fall back to an unsigned build."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/prosm-time-release.keystore
          printf 'storeFile=app/prosm-time-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Assemble the release APK (signed)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate the built APK and give it a fixed, version-less name
        # Fixed filename (not e.g. "app-release.apk") so prosm.net's own
        # download button can point at GitHub's stable
        # releases/latest/download/PROSM-Time.apk URL forever, across
        # every future version, with zero manual updates on the site's
        # side - see this workflow's own top comment.
        id: apk
        run: |
          set -e
          found=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$found" ]; then echo "No APK produced."; exit 1; fi
          fixed="$(dirname "$found")/PROSM-Time.apk"
          mv "$found" "$fixed"
          echo "path=$fixed" >> "$GITHUB_OUTPUT"
          echo "name=PROSM-Time.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: prosm-time-android
          path: ${{ steps.apk.outputs.path }}

  windows:
    name: Build Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Set this release's version in package.json
        # windows-latest defaults unmarked run: steps to PowerShell -
        # explicit shell: bash here keeps this one-liner's quoting
        # identical (and identically safe) across all 3 jobs that run
        # it, rather than trusting PowerShell's own single-quote rules
        # to behave the same way.
        shell: bash
        env:
          NEXT_VERSION: ${{ needs.test.outputs.nextVersion }}
        run: node -e 'const fs=require("fs"); const p=require("./package.json"); p.version=process.env.NEXT_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - run: npm run build
        env:
          VITE_BUILD_RELEASED_AT: ${{ needs.test.outputs.releasedAt }}
      # electron-builder auto-detects CI and implicitly tries to publish
      # (needs a GH_TOKEN it doesn't have here) unless told not to - the
      # "Publish GitHub Release" job handles uploading the built .exe
      # itself, so this build step must never attempt its own publish.
      - run: npx electron-builder --win --publish never

      - name: Locate the built installer
        id: exe
        shell: bash
        run: |
          set -e
          found=$(find release -maxdepth 1 -name "*.exe" | head -1)
          if [ -z "$found" ]; then echo "No installer produced."; exit 1; fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$found")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: prosm-time-windows
          path: ${{ steps.exe.outputs.path }}

  create-release:
    name: Publish GitHub Release
    needs: [android, windows, test]
    runs-on: ubuntu-latest
    outputs:
      # § user-directed, 2026-09-11 - real automatic version numbering.
      # This job's own checkout never had its package.json patched (it
      # only downloads already-built artifacts, doesn't run npm run
      # build) - reads the SAME nextVersion the android/windows/deploy-
      # web jobs each already baked into their own build, straight from
      # test's own output, rather than a second, potentially-stale read
      # of this checkout's unpatched package.json.
      version: ${{ needs.test.outputs.nextVersion }}
      android_url: ${{ steps.urls.outputs.android_url }}
      windows_url: ${{ steps.urls.outputs.windows_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Publish (or update) the release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.nextVersion }}
          name: PROSM Time v${{ needs.test.outputs.nextVersion }}
          generate_release_notes: true
          files: |
            artifacts/prosm-time-android/*.apk
            artifacts/prosm-time-windows/*.exe

      - id: urls
        run: |
          set -e
          android_name=$(basename "$(find artifacts/prosm-time-android -name '*.apk' | head -1)")
          windows_name=$(basename "$(find artifacts/prosm-time-windows -name '*.exe' | head -1)")
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.test.outputs.nextVersion }}"
          echo "android_url=$base/$android_name" >> "$GITHUB_OUTPUT"
          echo "windows_url=$base/$windows_name" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Build web, attach it to the Release, publish latest-version.json
    # user-directed 2026-09-10: GitHub Pages needs a paid plan on a
    # PRIVATE repo (confirmed live - "Your current plan does not
    # support GitHub Pages for this repository", HTTP 422) and the
    # user chose not to upgrade or use an external host - the web build
    # is distributed the same way as the APK/EXE instead: a zip
    # attached to the same GitHub Release. There is no live URL for
    # this build to be reached at; installing it means downloading and
    # unzipping the asset. See this commit's own message for the
    # remaining real limitation this creates (private-repo Release
    # assets need a GitHub-authenticated download, same caveat that
    # already applies to the APK/EXE).
    needs: [create-release, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      - name: Set this release's version in package.json
        env:
          NEXT_VERSION: ${{ needs.test.outputs.nextVersion }}
        run: node -e 'const fs=require("fs"); const p=require("./package.json"); p.version=process.env.NEXT_VERSION; fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");'

      - run: npm run build
        env:
          VITE_BUILD_RELEASED_AT: ${{ needs.test.outputs.releasedAt }}

      # Fixed filename (not e.g. "prosm-time-web-v2.3.2.zip") - same
      # reasoning as the APK's own fixed name above, so
      # releases/latest/download/PROSM-Time-Web.zip never changes.
      - name: Zip the web build
        run: cd dist && zip -r ../PROSM-Time-Web.zip .

      - name: Attach the web zip to the existing release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: PROSM-Time-Web.zip

      # releasedAt below is the SAME value (needs.test.outputs.releasedAt,
      # via the RELEASED_AT env var) every builder job already baked into
      # its own VITE_BUILD_RELEASED_AT - not a fresh `new Date()` call
      # here, which would always land a few minutes later than what
      # actually shipped in the binaries and defeat UpdateAvailableBanner
      # .tsx's own "is the manifest newer than my own build" comparison.
      # Kept as a YAML-level comment, not inside the embedded node -e
      # script below - a comment with an apostrophe inside that
      # single-quoted shell string once broke this exact step (real
      # failure hit and fixed the same day this was written).
      - name: Write and commit the release manifest installed clients poll
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          RELEASED_AT: ${{ needs.test.outputs.releasedAt }}
          ANDROID_URL: ${{ needs.create-release.outputs.android_url }}
          WINDOWS_URL: ${{ needs.create-release.outputs.windows_url }}
          WEB_URL: https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.version }}/PROSM-Time-Web.zip
        run: |
          set -e
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v${RELEASE_VERSION}"
          node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.RELEASE_VERSION,
              releasedAt: process.env.RELEASED_AT,
              downloads: {
                windows: process.env.WINDOWS_URL,
                android: process.env.ANDROID_URL,
                web: process.env.WEB_URL,
              },
            };
            fs.writeFileSync("public/latest-version.json", JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # package.json here was already patched to this release's
          # version by this job's own "Set this release's version in
          # package.json" step above (before npm run build) - committed
          # in the same push as the manifest so the repo's own checked-
          # in version becomes the base the NEXT run's patch-bump reads.
          git add public/latest-version.json package.json
          git diff --cached --quiet || git commit -m "chore: bump version to v${RELEASE_VERSION}, publish latest-version.json (not a ci-skip marker)"
          git push || echo "Nothing to push or a newer commit already landed - not fatal."
