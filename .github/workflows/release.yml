name: PROSM Time Release

# PROSM Time - user-directed: "any real update should build and publish
# automatically." Triggers on every push to main (not just tags) -
# builds Web/Android/Windows, publishes a GitHub Release tagged with
# package.json's own version, deploys the web build to GitHub Pages,
# and publishes latest-version.json (served from that same Pages URL)
# for UpdateAvailableBanner.tsx to poll. cancel-in-progress avoids a
# pileup of superseded builds when several commits land close together
# (this repo has seen many commits per hour in real sessions).
#
# GitHub is the build/distribution source only - installed clients
# never update themselves from source, they read the published
# manifest and point the user at the official download for their
# platform (see UpdateAvailableBanner.tsx).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: prosm-time-release
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - name: Install Android SDK (platform-tools, platforms;android-36, build-tools;36.0.0)
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Sync app version into the Android project
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Assemble the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate the built APK
        id: apk
        run: |
          set -e
          found=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$found" ]; then echo "No APK produced."; exit 1; fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$found")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: prosm-time-android
          path: ${{ steps.apk.outputs.path }}

  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win

      - name: Locate the built installer
        id: exe
        shell: bash
        run: |
          set -e
          found=$(find release -maxdepth 1 -name "*.exe" | head -1)
          if [ -z "$found" ]; then echo "No installer produced."; exit 1; fi
          echo "path=$found" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$found")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: prosm-time-windows
          path: ${{ steps.exe.outputs.path }}

  create-release:
    name: Publish GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      android_url: ${{ steps.urls.outputs.android_url }}
      windows_url: ${{ steps.urls.outputs.windows_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish (or update) the release for this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: PROSM Time v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/prosm-time-android/*.apk
            artifacts/prosm-time-windows/*.exe

      - id: urls
        run: |
          set -e
          android_name=$(basename "$(find artifacts/prosm-time-android -name '*.apk' | head -1)")
          windows_name=$(basename "$(find artifacts/prosm-time-windows -name '*.exe' | head -1)")
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}"
          echo "android_url=$base/$android_name" >> "$GITHUB_OUTPUT"
          echo "windows_url=$base/$windows_name" >> "$GITHUB_OUTPUT"

  deploy-web:
    name: Build web, publish to GitHub Pages, publish latest-version.json
    needs: create-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Build (with a Pages-relative asset base path)
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Write the release manifest installed clients poll
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
          ANDROID_URL: ${{ needs.create-release.outputs.android_url }}
          WINDOWS_URL: ${{ needs.create-release.outputs.windows_url }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.RELEASE_VERSION,
              releasedAt: new Date().toISOString(),
              downloads: {
                windows: process.env.WINDOWS_URL,
                android: process.env.ANDROID_URL,
                web: process.env.PAGES_URL,
              },
            };
            fs.writeFileSync("dist/latest-version.json", JSON.stringify(manifest, null, 2));
            fs.writeFileSync("public/latest-version.json", JSON.stringify(manifest, null, 2));
            console.log(JSON.stringify(manifest, null, 2));
          '

      - name: Commit the manifest back to main (source of truth for the next build too)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/latest-version.json
          git diff --cached --quiet || git commit -m "chore: publish latest-version.json for v${{ needs.create-release.outputs.version }} [skip ci]"
          git push || echo "Nothing to push or a newer commit already landed - not fatal."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
