# PROSM Time - continuous integration.
#
# Every push and pull request must clear the same gates a release does.
# Nothing is published from a build that did not pass them.
name: PROSM Time CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: prosm-time-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate, test, build and security gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Version consistency
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Unit and security regression tests
        run: npm test

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Database security assertions
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/run-security-sql-tests.sh

      - name: Production build
        run: npm run build

      - name: Security gate (stops the pipeline on any regression)
        run: npm run security:gate

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: prosm-time-web
          path: dist
          retention-days: 7
