entrypoint = "./functions/export-payroll-deductions/index.ts"

# QuickBooks Online payroll integration removed entirely 2026-09-15
# (user-directed - PROSM Finance now computes payroll natively via its
# own PROSM Time API-key bridge, so no external payroll software is
# needed at all). See prosm_time_quickbooks_removal_pending in memory.

# send-trial-notices is verify_jwt = false: it is called by pg_cron (no user
# session) and checks its own private secret (x-trial-secret) instead.
[functions.send-trial-notices]
enabled = true
