# service-role-only RPCs inside are the real authorization check.
[functions.sync-all-licenses]
enabled = true
verify_jwt = false
entrypoint = "./functions/sync-all-licenses/index.ts"

# 2026-11-08: listed explicitly (they already ran with the default verify_jwt = true).
[functions.change-site]
