project_id = "prosm-time"

# activate-organization is reached by a brand-new customer with NO
# Supabase session at all - it must accept the request before any JWT
# exists, then does its own real verification against PROSM
# Management's integration contract server-side (§5). Every other
# function keeps the default verify_jwt = true (an authenticated
# org member's own session is required).
[functions.activate-organization]
enabled = true
verify_jwt = false
entrypoint = "./functions/activate-organization/index.ts"

[functions.refresh-license-status]
enabled = true
verify_jwt = true
entrypoint = "./functions/refresh-license-status/index.ts"

[functions.invite-user]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-user/index.ts"

# redeem-invitation is the invited employee's own entry point - no
# session exists yet (§37), same reasoning as activate-organization.
[functions.redeem-invitation]
enabled = true
verify_jwt = false
entrypoint = "./functions/redeem-invitation/index.ts"

# request-password-reset/reset-password are a forgotten-password
# user's own entry point - no session exists yet, same reasoning as
# activate-organization/redeem-invitation.
[functions.request-password-reset]
enabled = true
verify_jwt = false
entrypoint = "./functions/request-password-reset/index.ts"

[functions.reset-password]
enabled = true
verify_jwt = false
entrypoint = "./functions/reset-password/index.ts"

[functions.clock-in]
enabled = true
verify_jwt = true
entrypoint = "./functions/clock-in/index.ts"

[functions.clock-out]
enabled = true
verify_jwt = true
entrypoint = "./functions/clock-out/index.ts"

[functions.admin-clock-in]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-clock-in/index.ts"

[functions.admin-clock-out]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-clock-out/index.ts"

# purge-camera-evidence is a maintenance endpoint (§16 retention-policy
# foundation), meant to be invoked by a future scheduler, never by an
# end user - verify_jwt=false because no ordinary org-member session
# should reach it at all; the function itself only proceeds when the
# caller's own Authorization header is literally the service role key.
[functions.purge-camera-evidence]
enabled = true
verify_jwt = false
entrypoint = "./functions/purge-camera-evidence/index.ts"

[functions.trigger-sos-alert]
enabled = true
verify_jwt = true
entrypoint = "./functions/trigger-sos-alert/index.ts"

[functions.submit-exception-reason]
