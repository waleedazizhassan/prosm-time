project_id = "prosm-time"

# activate-organization is reached by a brand-new customer with NO
# Supabase session at all - it must accept the request before any JWT
# exists, then does its own real verification against PROSM
# Management's integration contract server-side (§5). Every other
# function keeps the default verify_jwt = true (an authenticated
# org member's own session is required).
[functions.activate-organization]
enabled = true
verify_jwt = false
entrypoint = "./functions/activate-organization/index.ts"

[functions.refresh-license-status]
enabled = true
verify_jwt = true
entrypoint = "./functions/refresh-license-status/index.ts"

[functions.invite-user]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-user/index.ts"

# redeem-invitation is the invited employee's own entry point - no
# session exists yet (§37), same reasoning as activate-organization.
[functions.redeem-invitation]
enabled = true
verify_jwt = false
entrypoint = "./functions/redeem-invitation/index.ts"

[functions.clock-in]
enabled = true
verify_jwt = true
entrypoint = "./functions/clock-in/index.ts"

[functions.clock-out]
enabled = true
verify_jwt = true
entrypoint = "./functions/clock-out/index.ts"
