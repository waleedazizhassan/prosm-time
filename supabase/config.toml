# purge-location-samples mirrors purge-camera-evidence's own posture -
# a maintenance endpoint meant to be invoked by a future scheduler,
# never by an end user.
[functions.purge-location-samples]
enabled = true
verify_jwt = false
entrypoint = "./functions/purge-location-samples/index.ts"

# export-attendance is called by an external caller (a sibling PROSM
# product's own Edge Function) presenting this organization's own
# api_keys plaintext value as its Authorization header - never a
# Supabase JWT, so the platform's own JWT gate must be off. The RPC it
# calls (authenticate_prosm_time_api_key, service_role-only) is the
# real authorization check, same posture as purge-camera-evidence.
# api-v1: the general integration API (2026-11-08). Called by other systems with an API key
# in the Authorization header, not a Supabase session - the key is checked by
# authenticate_prosm_time_api_key_v1 (service role only).
[functions.api-v1]
enabled = true
verify_jwt = false
entrypoint = "./functions/api-v1/index.ts"

[functions.export-attendance]
enabled = true
verify_jwt = false
entrypoint = "./functions/export-attendance/index.ts"

# External/contractor workforce kiosk (user-directed). kiosk-worker-*
# keep the kiosk's posture (verify_jwt=true -
# the caller is whoever is signed into the operating kiosk device, the
# WORKER's own identity is proven by their 6-digit number inside the
# RPC, not the caller's session). export-worker-attendance mirrors
# export-attendance's own API-key posture.
[functions.kiosk-worker-clock-in]
enabled = true
verify_jwt = true
entrypoint = "./functions/kiosk-worker-clock-in/index.ts"

[functions.kiosk-worker-clock-out]
enabled = true
verify_jwt = true
entrypoint = "./functions/kiosk-worker-clock-out/index.ts"

[functions.export-worker-attendance]
enabled = true
verify_jwt = false
entrypoint = "./functions/export-worker-attendance/index.ts"

# PROSM Finance bridge (2026-09-14) - compensation export, its own
# payroll:read scope, same verify_jwt=false reasoning as the exports
# above (caller presents this org's own api_keys value, not a JWT).
[functions.export-worker-rates]
enabled = true
verify_jwt = false
entrypoint = "./functions/export-worker-rates/index.ts"

# PROSM Finance bridge (2026-09-15) - real sites/workforce directory,
# not just derived from attendance records that already exist. Same
# api_keys/attendance:read posture as export-attendance itself (names/
# status only, no compensation data, so this deliberately does not
# need payroll:read).
[functions.export-sites]
enabled = true
verify_jwt = false
entrypoint = "./functions/export-sites/index.ts"

[functions.export-workers]
enabled = true
verify_jwt = false
entrypoint = "./functions/export-workers/index.ts"

# PROSM Finance payroll bridge (2026-09-14) - same payroll:read scope,
