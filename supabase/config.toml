# purge-location-samples mirrors purge-camera-evidence's own posture -
# a maintenance endpoint meant to be invoked by a future scheduler,
# never by an end user.
[functions.purge-location-samples]
enabled = true
verify_jwt = false
entrypoint = "./functions/purge-location-samples/index.ts"

# export-attendance is called by an external caller (a sibling PROSM
# product's own Edge Function) presenting this organization's own
# api_keys plaintext value as its Authorization header - never a
# Supabase JWT, so the platform's own JWT gate must be off. The RPC it
# calls (authenticate_prosm_time_api_key, service_role-only) is the
# real authorization check, same posture as purge-camera-evidence.
[functions.export-attendance]
enabled = true
verify_jwt = false
entrypoint = "./functions/export-attendance/index.ts"

# QuickBooks Online payroll integration (the 3rd competitive gap).
# quickbooks-authorize/sync-quickbooks-time-activity require a real
# caller session (Owner-only, enforced inside the RPCs they call).
# quickbooks-oauth-callback is verify_jwt=false because Intuit's own
# browser redirect lands here with no Supabase session at all - the
# state param it carries is the real, single-use authorization check.
[functions.quickbooks-authorize]
enabled = true
verify_jwt = true
entrypoint = "./functions/quickbooks-authorize/index.ts"

[functions.quickbooks-oauth-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/quickbooks-oauth-callback/index.ts"

[functions.sync-quickbooks-time-activity]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-quickbooks-time-activity/index.ts"

# Xero and Gusto payroll integrations - additional providers alongside
# QuickBooks in the Settings > Payroll Integration selector. Same
# verify_jwt posture per function role as QuickBooks above. Both are
# deliberately dormant until XERO_CLIENT_ID/XERO_CLIENT_SECRET and
# GUSTO_CLIENT_ID/GUSTO_CLIENT_SECRET exist as real secrets.
[functions.xero-authorize]
enabled = true
verify_jwt = true
entrypoint = "./functions/xero-authorize/index.ts"

[functions.xero-oauth-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/xero-oauth-callback/index.ts"

[functions.sync-xero-timesheets]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-xero-timesheets/index.ts"

[functions.gusto-authorize]
enabled = true
verify_jwt = true
entrypoint = "./functions/gusto-authorize/index.ts"

[functions.gusto-oauth-callback]
enabled = true
verify_jwt = false
entrypoint = "./functions/gusto-oauth-callback/index.ts"

[functions.sync-gusto-hours]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-gusto-hours/index.ts"

# register-installation is called by a brand-new installation that may not
# have a session yet (the same reasoning as activate-organization). It mints
# nothing but an identity: the organization and every license decision are
# derived server-side afterwards.
[functions.register-installation]
enabled = true
verify_jwt = false
entrypoint = "./functions/register-installation/index.ts"

[functions.validate-installation]
enabled = true
verify_jwt = false
entrypoint = "./functions/validate-installation/index.ts"

# platform-installations and sync-protection-policy are service-to-service
# only: no user session is accepted, the PROSM Management integration key is
# verified inside the handler in constant time.
[functions.platform-installations]
enabled = true
verify_jwt = false
entrypoint = "./functions/platform-installations/index.ts"

[functions.sync-protection-policy]
enabled = true
verify_jwt = false
entrypoint = "./functions/sync-protection-policy/index.ts"
