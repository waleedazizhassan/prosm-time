[functions.send-push]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-push/index.ts"

# v2.3.55: a signed-in person deletes their own account (Google Play).
[functions.delete-my-account]
enabled = true
verify_jwt = true
entrypoint = "./functions/delete-my-account/index.ts"

# 2026-11-01: public on purpose - only the two switches the first screen reads.
